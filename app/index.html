<!doctype html>
<html lang="en" data-theme="dark" translate="no">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="google" content="notranslate" />
  <title>Mesh-Hunter</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b0e14" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hunter" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/app.css" />
  <!-- Theme before first paint (#563). app.js is a module, so it runs after
       the document is parsed; resolving the theme there alone means a stored
       light theme flashes the dark below it on every load. This must stay the
       same rule as resolveTheme() in src/theme.js: an explicit dark/light
       wins, anything else follows the device, and an unknown device
       preference leaves the data-theme already on the element. theme.test.js
       runs this script and compares it to resolveTheme rather than trusting
       the two to stay in step. -->
  <script>
    try {
      var p = localStorage.getItem('core-hunter-theme')
      document.documentElement.dataset.theme = (p === 'dark' || p === 'light') ? p
        : matchMedia('(prefers-color-scheme: dark)').matches === false ? 'light' : 'dark'
    } catch (e) {}
  </script>
    <!-- Matomo (self-hosted, cookieless; production hosts only) -->
    <script>
      if (location.hostname === 'mesh-hunter.eu' || location.hostname.endsWith('.mesh-hunter.eu')) {
        var _paq = window._paq = window._paq || [];
        _paq.push(['disableCookies']);
        _paq.push(['setDomains', ['*.mesh-hunter.eu']]);
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
          var u="https://analytics.fiten.eu/";
          _paq.push(['setTrackerUrl', u+'matomo.php']);
          _paq.push(['setSiteId', '10']);
          var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
          g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
        })();
      }
    </script>
    <!-- End Matomo Code -->
</head>
<body>
  <div id="map"></div>
  <header id="topbar">
    <div id="topbar-left">
      <div id="topbar-controls" role="group" aria-label="Target and filters">
        <button id="target-chip" aria-haspopup="true" aria-expanded="false">Select target</button>
        <button id="filter-pill" aria-label="Filters" aria-haspopup="true" aria-expanded="false">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
            <polygon points="2,3 18,3 12,11 12,18 8,16 8,11"/>
          </svg>
          <span class="filter-pill-label">Filters</span>
          <svg class="filter-pill-caret" width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 8l4 4 4-4"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="topbar-right">
      <button id="ticker-btn" class="topbar-btn" aria-label="Show receptions" hidden>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h14M3 10h10M3 14h6"/>
        </svg>
      </button>
      <button id="settings-btn" class="topbar-btn" aria-label="Menu, connection status">
        <span id="status-dots" role="img" aria-label="Connection status">
          <i id="dot-ble" title="BLE"></i>
          <i id="dot-mqtt" title="MQTT"></i>
        </span>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <path d="M3 6h14M3 10h14M3 14h14"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="toast-stack">
    <div id="no-capture-banner" class="nc-banner" role="status" hidden>
      <span id="nc-text"></span>
      <button type="button" id="nc-connect">Connect</button>
      <button type="button" id="nc-close" aria-label="Dismiss">✕</button>
    </div>
    <div id="bg-paused-banner" class="bg-paused-banner" role="status" hidden></div>
    <div id="bg-hint" class="bg-hint" role="status" hidden>
      <span>Keep the screen on and the app in the foreground — screen-off/background pauses capture.</span>
      <button type="button" id="bg-hint-close" aria-label="Dismiss">✕</button>
    </div>
    <div id="nodepos-note" role="status" hidden></div>
    <div id="nodepos-key" hidden></div>
  </div>
  <div id="rx-log" aria-label="Receptions"></div>
  <section id="hud">
    <div id="hud-readout-row">
      <div id="hud-rssi">—</div>
      <div id="hud-snr">—</div>
      <div id="hud-sender" title="Last reception — sender, or the repeater it was heard via">—</div>
      <div id="hud-since" title="Time since last packet">—</div>
      <!-- Receptions captured but not yet sent on. The MQTT dot answers
           "is the socket open", which is a different question (#454). -->
      <div id="hud-backlog" role="status" hidden></div>
    </div>
    <!-- The filtered/all stand shared with the ticker, and the quick actions
         on the shown sender (#555). The closed eye appears while the filter
         is keeping receptions off the HUD. -->
    <div id="hud-tools">
      <button type="button" id="hud-mode" class="hud-btn" aria-label="HUD shows filtered receptions">
        <svg class="hud-eye" width="13" height="13" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" hidden>
          <path d="M3 3l14 14"/>
          <path d="M8.5 5.3A8.6 8.6 0 0 1 10 5.2c4.2 0 7.3 3.4 8.3 4.8-.5.7-1.4 1.8-2.6 2.8M6.2 6.8C4 8 2.4 9.5 1.7 10c1 1.4 4.1 4.8 8.3 4.8 1.2 0 2.3-.3 3.3-.7"/>
          <path d="M8.2 8.2a2.5 2.5 0 0 0 3.6 3.6"/>
        </svg>
        <span id="hud-mode-label">Filtered</span>
      </button>
      <button type="button" id="hud-target" class="hud-btn" disabled aria-pressed="false">Target</button>
      <button type="button" id="hud-add" class="hud-btn" disabled aria-pressed="false">+ Target</button>
      <button type="button" id="hud-ignore" class="hud-btn" disabled aria-pressed="false">Ignore</button>
    </div>
    <div id="hud-bar">
      <div id="hud-bar-fill"></div>
      <div id="hud-bar-marker"></div>
    </div>
    <div id="hud-bar-labels">
      <span>COLDER · WEAK</span>
      <span>WARMER · CLOSE</span>
    </div>
  </section>
  <button id="layer-toggle" aria-label="View"></button>
  <button id="discover-btn" aria-label="Auto-discover: off" disabled>
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <circle cx="10" cy="10" r="1.6" fill="currentColor" stroke="none"/>
      <path d="M13 7a4.2 4.2 0 0 1 0 6"/>
      <path d="M15.6 4.6a8 8 0 0 1 0 10.8"/>
      <path d="M7 13a4.2 4.2 0 0 1 0-6"/>
      <path d="M4.4 15.4a8 8 0 0 1 0-10.8"/>
    </svg>
  </button>
  <button id="recenter-btn" aria-label="Compass: north up"></button>
  <button id="nodepos-toggle" aria-label="Advertised node positions" aria-pressed="false">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M10 17V9"/>
      <path d="M7 17h6l-3-4z" fill="currentColor"/>
      <path d="M6.8 7.2a4.5 4.5 0 0 1 6.4 0"/>
      <path d="M4.6 4.8a7.6 7.6 0 0 1 10.8 0"/>
    </svg>
  </button>
  <button id="sound-toggle" aria-label="Sound: off"></button>
  <aside id="filter-sheet" hidden></aside>
  <aside id="settings-sheet" hidden></aside>
  <aside id="target-sheet" hidden></aside>
  <aside id="splash">
    <div class="splash-callout co-controls" id="co-controls"></div>
    <div class="splash-callout co-menu" id="co-menu"></div>
    <div class="splash-callout co-fabs" id="co-fabs"></div>
    <div class="splash-panel">
      <button type="button" id="splash-x" class="splash-x" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M5 5l10 10M15 5L5 15"/>
        </svg>
      </button>
      <div class="splash-band">
        <!-- The PWA icon (public/icon.svg) without its background tile: one
             brand mark for the product (#539). -->
        <svg width="44" height="44" viewBox="0 0 512 512" aria-hidden="true">
          <polygon points="424,256 340,111 172,111 88,256 172,401 340,401" fill="none" stroke="var(--ch-accent)" stroke-width="12" stroke-linejoin="round"/>
          <g fill="none" stroke-width="15" stroke-linecap="round">
            <path d="M326 168 A112 112 0 0 1 326 344" stroke="var(--ch-sig-cool)"/>
            <path d="M186 168 A112 112 0 0 0 186 344" stroke="var(--ch-sig-cool)"/>
            <path d="M300 200 A68 68 0 0 1 300 312" stroke="var(--ch-sig-warm)"/>
            <path d="M212 200 A68 68 0 0 0 212 312" stroke="var(--ch-sig-warm)"/>
          </g>
          <g stroke="var(--ch-accent)" stroke-width="10" stroke-linecap="round">
            <line x1="256" y1="128" x2="256" y2="196"/><line x1="256" y1="316" x2="256" y2="384"/>
            <line x1="128" y1="256" x2="196" y2="256"/><line x1="316" y1="256" x2="384" y2="256"/>
          </g>
          <circle cx="256" cy="256" r="26" fill="var(--ch-sig-hot)"/>
        </svg>
        <h1 id="splash-name" class="splash-wordmark">Mesh-Hunter</h1>
        <div class="splash-domain">mesh-hunter.eu</div>
      </div>
      <div class="splash-body">
        <div id="splash-rows" class="splash-rows"></div>
        <div id="splash-ctas" class="splash-ctas">
          <button type="button" id="connect-btn" class="splash-cta">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 6.2l6 7.6-3 2.4V3.8l3 2.4-6 7.6"/>
            </svg>
            <span>Connect companion</span>
          </button>
          <p id="splash-noble" class="splash-noble" hidden></p>
          <div class="splash-secrow">
            <a class="splash-sec" href="https://mesh-hunter.eu" target="_blank" rel="noopener">mesh-hunter.eu</a>
            <a class="splash-sec" href="https://map.mesh-hunter.eu" target="_blank" rel="noopener">Analyser map</a>
          </div>
        </div>
        <p id="splash-status" class="splash-status"></p>
        <button type="button" id="splash-retry" class="splash-retry" hidden>Retry</button>
        <!-- Tour-only fallback (#316): on a screen too cramped for the three
             floating callouts, their copy moves into the panel instead. -->
        <ul id="splash-callout-list" class="splash-callout-list" hidden></ul>
        <p id="splash-disclaimer" class="splash-disclaimer"></p>
      </div>
    </div>
    <button type="button" id="splash-close" class="splash-close" aria-label="Close" hidden>
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M5 5l10 10M15 5L5 15"/>
      </svg>
    </button>
  </aside>
  <!-- Gate-only coach marks (#539/#384): ring on the target, thin leader line,
       small box beside its own control. Positioned at runtime, and siblings of
       #splash rather than children of it (#562): #splash is a stacking context
       (position: fixed + z-index), so a ring nested inside it is capped at
       #splash's own layer and paints under the bar the gate lifts above the
       scrim, which is where two of the three targets live. refreshSplash()
       sets `hidden` on all nine on every state change, so they still come and
       go with the gate. -->
  <div class="splash-ring" id="cm-controls-ring" hidden></div>
  <div class="splash-lead" id="cm-controls-lead" hidden></div>
  <div class="splash-cm" id="cm-controls" hidden></div>
  <div class="splash-ring" id="cm-menu-ring" hidden></div>
  <div class="splash-lead" id="cm-menu-lead" hidden></div>
  <div class="splash-cm" id="cm-menu" hidden></div>
  <div class="splash-ring" id="cm-fabs-ring" hidden></div>
  <div class="splash-lead" id="cm-fabs-lead" hidden></div>
  <div class="splash-cm" id="cm-fabs" hidden></div>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
