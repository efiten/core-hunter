name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: app (PWA) — vitest + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run
      - run: npm run build

  web:
    name: web — vitest + playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
        # --fail-on-flaky-tests, not retries: 0 (#367): a test that fails first
        # and passes on the retry used to report green, which is how #361 hid a
        # 12%-of-loads race for months. The retry still runs, so
        # trace: 'on-first-retry' still produces the only artefact a rare race
        # ever leaves, but needing it now fails the build.
      - run: npx playwright test --fail-on-flaky-tests

  nameresolver:
    name: nameresolver — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nameresolver
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nameresolver/package-lock.json
      - run: npm ci
      - run: npx eslint .
      - run: npx vitest run

  landing:
    name: landing — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vitest run

  server:
    name: server (Go) — vet + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
