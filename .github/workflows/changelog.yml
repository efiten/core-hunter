# Rebuilds the two shipped changelog copies from changelog.d/ (#509).
#
# A PR adds one file under changelog.d/ and commits both regenerated copies,
# app/changelog.json and web/changelog.json: web/parity.test.js fails on the PR
# while a copy is not what the source produces (AGENTS.md). Neither deploy can
# generate the file itself: the app image builds with app/ as its Docker
# context and the website is copied to the nginx box as a flat file list.
#
# This job is the safety net on master: if a merge still leaves the copies
# behind changelog.d/, it rebuilds and commits them. On a PR nothing runs here.
#
# The push this makes retriggers the workflow once; the second run finds both
# copies already current and commits nothing, so it stops there.
name: changelog

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Rebuild from changelog.d
        run: node scripts/build-changelog.mjs

      - name: Commit if the copies moved
        run: |
          set -euo pipefail
          if git diff --quiet -- app/changelog.json web/changelog.json; then
            echo "both copies already match changelog.d/"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/changelog.json web/changelog.json
          git commit -m "chore: rebuild the changelog copies from changelog.d"
          git push
