<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mesh-Hunter — analysis</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Installable (#194): manifest only, no service worker (no offline caching --
       this is an online analysis tool that always needs the server/API). The
       manifest + touch icon are added in the module below with the same ?v=
       buster as the other assets, so a future manifest/icon edit isn't served stale. -->
  <meta name="theme-color" content="#0b0e14" />
  <script type="module">
    import { VERSION } from './version.js'
    import { initial } from './urlstate.js'
    // Captured here (before filters.js/map.js even start fetching) because
    // the hunter picker's roster arrives async from /api/hunters; by the time
    // that resolves, map.js's synchronous urlstate.load()->save() has already
    // normalized the URL/storage to the (still-empty) live selection, which
    // would otherwise wipe out a shared/saved hunter selection (#196).
    window.__initialHunter = initial('hunter', '')
    // The ?v= buster covers the stylesheet, the manifest/icon and the two entry
    // scripts — NOT the module graph behind them: `import './signal.js'`
    // resolves without the query, so nothing imported is versioned (#347).
    //
    // That is safe only because the site is served with `Cache-Control:
    // no-cache`, which makes the browser revalidate every asset against its
    // ETag before use — measured 2026-08-15 on map.mesh-hunter.eu for
    // index.html, map.js, signal.js and style.css. So a module can never be
    // served stale against a fresh stylesheet, and the buster is belt and
    // braces rather than the mechanism.
    //
    // Which direction is dangerous is worth being precise about. A CSS token
    // and the JS that reads it ship together (`--ch-sig-faint` and the faint
    // tier both landed in #344), so a STALE module never asks for a token its
    // stylesheet lacks — that pairing is harmless, and it is also the only one
    // the current setup can produce, since style.css is versioned and the
    // module graph is not. The breaking pairing is the reverse: a stale
    // style.css against a fresh signal.js, where cssVar() returns '' and
    // Leaflet's canvas silently ignores an empty fillStyle, so points inherit
    // the previous colour instead of failing visibly. The buster is what
    // prevents that one.
    //
    // If the nginx policy ever became a max-age, note that versioning the
    // imports would NOT rescue it: `VERSION` comes from ./version.js, imported
    // unversioned above, and index.html would be cached too — a stale
    // version.js yields a stale ?v= and resolves the whole graph to the old
    // files. index.html and version.js have to stay uncached for any buster
    // scheme to mean anything.
    const v = '?v=' + VERSION
    const css = document.createElement('link')
    css.rel = 'stylesheet'; css.href = 'style.css' + v
    document.head.appendChild(css)
    for (const [rel, href] of [['manifest', '/manifest.webmanifest'], ['apple-touch-icon', '/icon-192.png']]) {
      const l = document.createElement('link')
      l.rel = rel; l.href = href + v
      document.head.appendChild(l)
    }
    // async = false is load-bearing, not tidiness (#353). A dynamically
    // created <script> defaults to async, so these two race: map.js evaluates
    // whenever its own module graph finishes, which can be before filters.js
    // has defined window.currentHunters/currentTypes. map.js calls those from
    // urlstate.register() during evaluation, so losing the race throws
    // "window.currentHunters is not a function" and kills the whole module —
    // no map, no /api/auth/me, no wiring, a dead page with one console line.
    // Setting async=false restores insertion-order execution for dynamically
    // inserted module scripts, which is the ordering the code assumes.
    for (const src of ['filters.js', 'map.js']) {
      const s = document.createElement('script')
      s.type = 'module'; s.async = false; s.src = src + v
      document.body.appendChild(s)
    }
  </script>
    <!-- Matomo (self-hosted, cookieless; production hosts only) -->
    <script>
      if (location.hostname === 'mesh-hunter.eu' || location.hostname.endsWith('.mesh-hunter.eu')) {
        var _paq = window._paq = window._paq || [];
        _paq.push(['disableCookies']);
        _paq.push(['setDomains', ['*.mesh-hunter.eu']]);
        _paq.push(['trackPageView']);
        _paq.push(['enableLinkTracking']);
        (function() {
          var u="https://analytics.fiten.eu/";
          _paq.push(['setTrackerUrl', u+'matomo.php']);
          _paq.push(['setSiteId', '10']);
          var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
          g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
        })();
      }
    </script>
    <!-- End Matomo Code -->
</head>
<body>
  <header id="bar">
    <span class="ms-wrap">
      <button id="hp-toggle" type="button" class="ms-toggle" title="All hunters if none selected" aria-expanded="false">Hunters ▾</button>
      <div id="hunter-picker" class="tl-panel" hidden>
        <div class="tl-pinned-label">Top</div>
        <div id="hp-pinned" class="tl-list tl-pinned"></div>
        <ul id="hp-list" class="tl-list tl-scroll"></ul>
      </div>
    </span>
    <span class="ms-wrap">
      <input id="f-sender" type="text" placeholder="sender id (prefix)" />
      <button id="sp-toggle" type="button" class="ms-toggle" title="Pick from heard senders" aria-expanded="false">▾</button>
      <div id="sender-picker" class="tl-panel" hidden>
        <div class="tl-pinned-label">Top</div>
        <div id="tp-pinned" class="tl-list tl-pinned"></div>
        <ul id="tp-list" class="tl-list tl-scroll"></ul>
      </div>
    </span>
    <!-- #285: f-from/f-to stay the state carriers (urlstate binds them, and
         they now hold either an absolute datetime-local string or a relative
         token like "now-6h"), but are no longer the UI -- the picker below
         writes them. Hidden rather than removed so every existing binding,
         listener and deep link keeps working unchanged. -->
    <input id="f-from" type="hidden" />
    <input id="f-to" type="hidden" />
    <span class="tr-wrap">
      <button id="tr-toggle" type="button" aria-expanded="false" title="Change the time range">
        <span aria-hidden="true">&#128339;</span> <span id="tr-label">Today</span>
      </button>
      <div id="time-picker" class="tr-panel" hidden>
        <div class="tr-cols">
          <div class="tr-abs">
            <div class="tr-head">Absolute time range</div>
            <label class="tr-field">From <input id="tr-from" type="datetime-local" /></label>
            <label class="tr-field">To <input id="tr-to" type="datetime-local" /></label>
            <div class="tr-actions"><button id="tr-apply" type="button" class="tr-primary">Apply time range</button></div>
            <button id="tr-copy" type="button" class="tr-copy" title="Copy a link with this range frozen to fixed timestamps">Copy absolute link</button>
          </div>
          <ul id="tr-quick" class="tr-quick"></ul>
        </div>
      </div>
    </span>
    <span id="f-types"></span>
    <label class="cs-cb"><input type="checkbox" id="f-direct" /> Direct only</label>
    <button id="layer-toggle">points</button>
    <!-- hidden until the role is known (#270): applyLocateGate() is then the
         single owner of this button's visibility, setting it on every role
         change. Shipping it visible made it live during the boot window, where
         activateLocate() silently returns on the role gate ('guest' default)
         with no retry, and a guest saw a working-looking control until the
         gate caught up. -->
    <button id="locate-toggle" hidden>Locate</button>
    <span class="cs-layer-toggle">
      <label class="cs-cb"><input type="checkbox" id="cs-adverts" /> CS adverts</label>
      <label class="cs-cb"><input type="checkbox" id="cs-relays" /> CS relays</label>
    </span>
    <span class="np-layer-toggle">
      <label class="cs-cb"><input type="checkbox" id="f-nodepos" /> Node positions</label>
    </span>
    <button id="clear-filters" title="Clear all filters">Clear</button>
    <button id="theme-toggle" title="Toggle light/dark">🌙</button>
    <button id="help-btn" title="How this map works" aria-label="How this map works" aria-haspopup="dialog" aria-expanded="false" aria-controls="wb-onboarding">?</button>
    <button id="auth-btn" class="bar-btn">Log in</button>
    <span id="guest-notice" class="guest-notice" hidden></span>
    <span id="status"></span>
    <span id="sf-counts"></span>
    <button id="ch-version" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="whatsnew-modal"><span id="ch-version-text"></span><span id="wn-dot" class="wn-dot" hidden aria-hidden="true"></span></button>
  </header>
  <div id="locate-info" hidden></div>
  <!-- Two surfaces for one layer (#376). The key names the glyphs while markers
       are drawn, and otherwise says which way the layer came up empty; the note
       is the disclaimer, which only appears when there are positions to
       disclaim. column-reverse in the stylesheet keeps the key pinned to the
       bottom corner whether or not the note above it is showing, so neither
       needs to know the other's height. role=status so a screen reader hears
       the state change without the focus moving. -->
  <div id="nodepos-stack">
    <div id="nodepos-key" role="status" hidden></div>
    <div id="nodepos-note" hidden>Positions are inferred from radio measurements (RSSI/SNR) via mesh topology — not GPS tracking of the node. Advertised positions are self-reported by their operators.</div>
  </div>
  <div id="login-modal" class="lc-modal" hidden>
    <form id="login-form" class="lc-card">
      <h4>Log in</h4>
      <input id="login-user" type="text" placeholder="Username" autocomplete="username" />
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" />
      <label class="lc-remember"><input id="login-remember" type="checkbox" /> Remember me</label>
      <p id="login-error" class="lc-warn" hidden>Login failed.</p>
      <div class="lc-actions">
        <button id="login-submit" type="submit">Log in</button>
        <button id="login-cancel" type="button">Cancel</button>
      </div>
    </form>
  </div>
  <div id="whatsnew-modal" class="lc-modal" hidden>
    <div class="lc-card wn-card" role="dialog" aria-modal="true" aria-labelledby="wn-title">
      <h4 id="wn-title">What's new</h4>
      <div id="wn-body" class="wn-body"></div>
      <div class="lc-actions"><button id="wn-close" type="button">Close</button></div>
    </div>
  </div>
  <!-- First-run onboarding (#316). The callouts are positioned from
       onboarding.js against the real controls they point at, the same way the
       app's splash does it; the toolbar is lifted above the scrim so the tour
       highlights live controls rather than a picture of them. -->
  <div id="wb-scrim" hidden></div>
  <!-- role="dialog" without aria-modal on purpose: the toolbar is deliberately
       left usable through the scrim, so telling assistive tech the rest of the
       page is inert would be a lie. Focus still moves in and back out, matching
       whatsnew.js (#363). -->
  <aside id="wb-onboarding" role="dialog" aria-labelledby="wb-title" hidden>
    <div class="wb-callout" id="wb-co-filters"></div>
    <div class="wb-callout" id="wb-co-layers"></div>
    <div class="wb-callout" id="wb-co-account"></div>
    <div class="wb-panel">
      <h1 id="wb-title"></h1>
      <p id="wb-tagline" class="wb-tagline"></p>
      <ul id="wb-basics" class="wb-basics"></ul>
      <!-- Narrow viewports get the callout copy inside the panel instead:
           there is no room beside the toolbar for three floating boxes, and the
           panel would cover them. -->
      <ul id="wb-inline" class="wb-inline" hidden></ul>
      <p id="wb-disclaimer" class="wb-disclaimer"></p>
      <button type="button" id="wb-got-it" class="wb-got-it">Got it</button>
    </div>
    <button type="button" id="wb-close" class="wb-close" aria-label="Close">✕</button>
  </aside>
  <div id="map"></div>
  <div id="rx-log"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { VERSION } from './version.js';
    import { API_BASE } from './config.js';
    import { initWhatsNew } from './whatsnew.js';
    // Only the text span is rewritten by the server-version fetch — the dot is
    // a sibling, so it survives (#284).
    const el = document.getElementById('ch-version-text');
    el.textContent = 'web v' + VERSION;
    initWhatsNew();
    fetch(`${API_BASE}/api/version`)
      .then((r) => r.json())
      .then((d) => { if (d.server) el.textContent = `web v${VERSION} · srv v${d.server}`; })
      .catch(() => {});
  </script>
  <script type="module">
    import { initOnboarding } from './onboarding.js';
    initOnboarding();
  </script>
  <script type="module">
    import { nodeCountsText } from './nodecounts.js';
    nodeCountsText()
      .then((t) => { if (t) document.getElementById('sf-counts').textContent = t; })
      .catch(() => {});
  </script>
</body>
</html>
